services:
  - type: web
    name: expert-visiteur-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false # paste the Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://nourtliba.github.io
      - key: ADMIN_PASSWORD
        sync: false # first admin password (changed at first login)

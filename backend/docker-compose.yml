# Whole backend + database on any machine with Docker:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expert
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expert}
      POSTGRES_DB: expertvisiteur
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expert -d expertvisiteur"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://expert:${DB_PASSWORD:-expert}@db:5432/expertvisiteur
    ports:
      - "3000:3000"

volumes:
  dbdata:

<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Expert Visiteur - Connexion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&family=Be+Vietnam+Pro:ital,wght@0,400;1,400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&family=Source+Sans+3:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Sketchbook Marginalia Effects */
        .sketch-border {
            position: relative;
        }
        .sketch-border::after {
            content: '';
            position: absolute;
            inset: -2px;
            border: 1px solid #817472;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0.4;
            transform: rotate(0.2deg);
        }

        .pencil-texture {
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
            background-blend-mode: multiply;
        }

        .art-deco-sunburst {
            background: 
                radial-gradient(circle at center, transparent 30%, #e8e2d8 31%, transparent 32%),
                conic-gradient(from 0deg, transparent 0deg 10deg, #d3c3c0 11deg 12deg, transparent 13deg 22deg, #d3c3c0 23deg 24deg, transparent 25deg);
            background-size: 100% 100%;
            opacity: 0.15;
        }

        .handwritten {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-style: italic;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-5px) rotate(-3deg); }
            100% { transform: translateY(0px) rotate(-5deg); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Art Deco Fan Pattern */
        .fan-pattern {
            width: 80px;
            height: 40px;
            background: 
                radial-gradient(circle at 50% 100%, transparent 10%, #6f5955 11%, #6f5955 14%, transparent 15%),
                radial-gradient(circle at 50% 100%, transparent 25%, #6f5955 26%, #6f5955 29%, transparent 30%),
                radial-gradient(circle at 50% 100%, transparent 40%, #6f5955 41%, #6f5955 44%, transparent 45%);
            opacity: 0.8;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#dcc0bb",
                        "error": "#ba1a1a",
                        "surface-variant": "#e8e2d8",
                        "surface-dim": "#e0d9cf",
                        "on-background": "#1e1b15",
                        "on-tertiary-fixed": "#0c1e26",
                        "outline-variant": "#d3c3c0",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#b7c9d4",
                        "on-secondary-fixed-variant": "#3c4a3c",
                        "on-primary-container": "#715c57",
                        "inverse-on-surface": "#f7f0e6",
                        "on-surface-variant": "#4f4442",
                        "surface-container": "#f4ede3",
                        "surface-container-high": "#eee7dd",
                        "surface-container-highest": "#e8e2d8",
                        "on-primary-fixed": "#271814",
                        "tertiary": "#50616a",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#dcc0bb",
                        "on-secondary-fixed": "#111f13",
                        "surface-bright": "#fff8f0",
                        "outline": "#817472",
                        "surface-tint": "#6f5955",
                        "on-secondary-container": "#576757",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#d3e4d1",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#384952",
                        "background": "#fff8f0",
                        "on-tertiary-container": "#52636c",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#f9dcd6",
                        "secondary": "#536253",
                        "secondary-fixed": "#d6e7d4",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#56423e",
                        "tertiary-container": "#cddfea",
                        "on-surface": "#1e1b15",
                        "secondary-fixed-dim": "#bacbb9",
                        "primary-container": "#f3d6d0",
                        "primary": "#6f5955",
                        "surface": "#fff8f0",
                        "inverse-surface": "#33302a",
                        "tertiary-fixed": "#d3e5f0",
                        "surface-container-low": "#faf3e9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "unit": "8px",
                        "margin-mobile": "16px",
                        "container-max": "1280px",
                        "margin-desktop": "48px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "annotation": ["Be Vietnam Pro"],
                        "body-lg": ["Source Sans 3"],
                        "body-md": ["Source Sans 3"],
                        "headline-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "label-caps": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.15em", "fontWeight": "700"}],
                        "annotation": ["14px", {"lineHeight": "1.4", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "0.1em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface-container-low min-h-screen flex flex-col items-center justify-center p-gutter pencil-texture overflow-x-hidden">
<!-- Decorative Top Margins -->
<div class="fixed top-0 left-0 w-full h-24 pointer-events-none opacity-20 hidden lg:block">
<div class="absolute left-margin-desktop top-margin-desktop border-l border-outline h-32"></div>
<div class="absolute right-margin-desktop top-margin-desktop border-r border-outline h-32"></div>
</div>
<!-- Main Container -->
<main class="relative w-full max-w-md mx-auto">
<!-- Art Deco Fan Emblem -->
<div class="flex justify-center mb-12">
<div class="relative">
<div class="fan-pattern"></div>
<div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-32 h-px bg-outline-variant"></div>
</div>
</div>
<!-- Card Frame (Decorative Sunburst) -->
<div class="relative p-unit sketch-border bg-white/30 rounded-xl overflow-visible">
<!-- Decorative corner sunbursts -->
<div class="absolute -top-6 -left-6 w-12 h-12 opacity-30">
<span class="material-symbols-outlined text-4xl text-outline" style="font-variation-settings: 'FILL' 0;">wb_sunny</span>
</div>
<div class="absolute -bottom-6 -right-6 w-12 h-12 opacity-30">
<span class="material-symbols-outlined text-4xl text-outline" style="font-variation-settings: 'FILL' 0;">wb_sunny</span>
</div>
<!-- Actual Login Card -->
<div class="relative bg-surface-container-lowest p-10 rounded-lg shadow-sm border border-outline-variant">
<div class="mb-8 text-center">
<h1 class="font-headline-lg text-headline-lg text-primary uppercase tracking-widest mb-2">Expert Visiteur</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant opacity-70">Portail d'Accréditation Médicale</p>
</div>
<form class="space-y-6" id="loginForm">
<!-- Assessor ID -->
<div class="group">
<label class="block font-label-caps text-label-caps text-primary mb-1 uppercase tracking-tighter" for="assessorId">Identifiant Évaluateur</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-3 px-1 font-body-md text-body-md text-on-background focus:ring-0 focus:border-primary transition-all placeholder:text-on-surface-variant/30 outline-none" id="assessorId" name="assessorId" placeholder="EV-2024-0000" type="text"/>
<div class="absolute bottom-0 left-0 w-0 h-px bg-primary transition-all duration-300 group-focus-within:w-full"></div>
</div>
</div>
<!-- Password -->
<div class="group">
<label class="block font-label-caps text-label-caps text-primary mb-1 uppercase tracking-tighter" for="password">Mot de Passe</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-3 px-1 font-body-md text-body-md text-on-background focus:ring-0 focus:border-primary transition-all placeholder:text-on-surface-variant/30 outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute bottom-0 left-0 w-0 h-px bg-primary transition-all duration-300 group-focus-within:w-full"></div>
</div>
</div>
<div class="flex items-center justify-between pt-2">
<a class="font-annotation text-annotation text-on-surface-variant hover:text-primary underline decoration-dotted decoration-outline-variant" href="#">Besoin d'aide ?</a>
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded-sm border-outline text-primary focus:ring-primary/20 bg-transparent" id="remember" type="checkbox"/>
<label class="font-annotation text-annotation text-on-surface-variant" for="remember">Se souvenir de moi</label>
</div>
</div>
<!-- Login Button & Sketch Marginalia -->
<div class="relative pt-8">
<!-- Sketch Arrow & Caption -->
<div class="absolute -right-24 top-1/2 -translate-y-1/2 hidden md:block pointer-events-none">
<div class="relative animate-float">
<svg class="text-outline" fill="none" height="40" viewbox="0 0 80 40" width="80" xmlns="http://www.w3.org/2000/svg">
<path d="M10 30C25 35 45 35 70 10M70 10L62 12M70 10L68 18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
<p class="handwritten text-annotation text-on-surface-variant absolute -bottom-4 -left-4 w-32 rotate-[-5deg]">commencer ici</p>
</div>
</div>
<button class="w-full py-4 bg-primary text-on-primary rounded-lg font-label-caps text-label-caps uppercase tracking-widest hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
                            Se Connecter
                            <span class="material-symbols-outlined text-lg transition-transform group-hover:translate-x-1">arrow_right_alt</span>
</button>
</div>
</form>
</div>
</div>
<!-- Footer Marginalia -->
<div class="mt-12 text-center">
<p class="font-annotation text-annotation text-on-surface-variant italic opacity-60">
                Session sécurisée pour l'Accréditation V2024
            </p>
<div class="mt-4 flex justify-center gap-6">
<div class="w-8 h-px bg-outline-variant"></div>
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 1;">security</span>
<div class="w-8 h-px bg-outline-variant"></div>
</div>
</div>
</main>
<!-- Side Illustration (Sketchbook feel) -->
<div class="fixed left-gutter bottom-gutter hidden xl:block w-64 opacity-20 select-none">
<div class="w-full h-64 bg-contain bg-no-repeat bg-bottom" data-alt="A detailed pencil sketch of a classical medical emblem, including a Rod of Asclepius and olive branches. The drawing features visible graphite cross-hatching and loose, artistic lines that feel hand-drawn on aged cream paper. The style is academic and institutional but artistic, fitting a scholar's sketchbook aesthetic with a soft warm-grey color palette." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD9gI_8X7_L4J_UlzyuLZATf6VWf1rKmX3zI6HypPQkCa0sutNdg305l67BF2uWpHiFrpF5f_p3opmOtwGFaHJxhKXC5EDOgHD7kdN_WdWjU7plB9IX1iNvntJY7oVPvKk4-iTLJ85K5d40muyEPpVndgngL3DJcrDnDChy1NPoigzHytmPFDX4Wf5G0oXfeMoFEhubKedYMJhOZuzwzq9bbGMypEvuU5Vb13xK8klrVmhbB9PMocvW0CmCRqrQgv2YF4m58T7Nhg39')"></div>
</div>
<script>
        // Micro-interaction for form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            btn.classList.add('opacity-80');
            
            // Artificial delay for feedback
            setTimeout(() => {
                alert('Connexion en cours...');
                btn.innerHTML = 'Se Connecter <span class="material-symbols-outlined text-lg transition-transform group-hover:translate-x-1">arrow_right_alt</span>';
                btn.classList.remove('opacity-80');
            }, 1000);
        });

        // Pencil circling micro-interaction for checkboxes
        const checkbox = document.getElementById('remember');
        checkbox.addEventListener('change', function() {
            if(this.checked) {
                this.parentElement.style.transition = "all 0.3s ease";
                this.parentElement.classList.add('scale-105');
            } else {
                this.parentElement.classList.remove('scale-105');
            }
        });
    </script>
</body></html>
